server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/usersdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tfm1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:96425096371-7va5radmmcfqoobfcql3653bblp9f684.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/{registrationId}}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:r7AzZORXtBbbyTduBIxAqK2x76JK75C0cimql1v8JPQ}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  oauth:
    frontend-callback-url: ${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:5173/oauth/callback}


eureka:
    client:
        enabled: true
        service-url:
            defaultZone: http://localhost:8761/eureka
    instance:
        preferIpAddress: true
        hostname: ms-auth-service