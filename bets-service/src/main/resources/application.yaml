server:
  port: 8086

spring:
  config:
    import : optional:file:.env
  application:
    name: bets-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/betsdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tfm1234}

  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
      open-in-view: false
      properties:
        hibernate:
          '[format_sql]': true

eureka:
    client:
        enabled: true
        service-url:
            defaultZone: http://localhost:8761/eureka
    instance:
        preferIpAddress: true
        hostname: bets-service