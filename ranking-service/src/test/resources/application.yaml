spring:
  datasource:
    url: jdbc:h2:mem:rankings_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none

eureka:
    client:
        enabled: true
        service-url:
            defaultZone: http://localhost:8761/eureka
    instance:
        preferIpAddress: true
        hostname: ranking-service

management:
  endpoints:
    enabled-by-default: false
