server:
  port: 8082

spring:
  config:
    import : optional:file:.env
  application:
    name: ranking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rankingsdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tfm1234}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true

logging:
  level:
    '[org.hibernate.SQL]': warn
    '[org.springframework.web]': info


eureka:
    client:
        enabled: true
        service-url:
            defaultZone: http://localhost:8761/eureka
    instance:
        preferIpAddress: true
        hostname: ms-rankings